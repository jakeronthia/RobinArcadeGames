<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}html,body{margin:0;height:100%;background:#0a0712}</style>
<script src="ranked.js"></script>
<title>Ravenport Brawl</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: full-viewport top-down arena; match HUD top-center, twin-stick controls at the bottom corners, menus on cards */
:root{
  --night:#0a0712; --panel:rgba(24,16,58,.86); --glass:rgba(255,255,255,.14); --line:rgba(255,255,255,.26);
  --ink:#ffffff; --dim:#c9bfff; --gold:#ffc93c; --sky:#7fe3ff; --red:#ff5a78; --green:#3ddc6a; --gem:#b37bff;
  --round:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--round);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;display:flex;justify-content:center;pointer-events:none;z-index:2;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.score{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:6px 16px;font-variant-numeric:tabular-nums;font-weight:700}
.score .tm{font-size:1.5rem;min-width:1.4em;text-align:center}
.score .blue{color:var(--green)}.score .red{color:var(--red)}
.score .mid{display:flex;flex-direction:column;align-items:center;line-height:1;min-width:84px}
.score .mid small{font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600}
.score .mid b{font-size:1.05rem}
.score .cd{color:var(--gold)}
.gemi{width:14px;height:14px;background:var(--gem);transform:rotate(45deg);display:inline-block;border-radius:2px}
.pauseb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(16px,env(safe-area-inset-right,0px));z-index:3;width:44px;height:44px;border-radius:50%;
  background:var(--panel);border:2px solid var(--line);color:var(--ink);font-family:var(--round);font-weight:700;cursor:pointer}
.ctrl{position:fixed;z-index:3;border-radius:50%;border:0;padding:0;font-family:var(--round);font-weight:700;color:var(--ink);cursor:pointer;touch-action:none;display:grid;place-items:center}
#atkBtn{right:max(24px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:104px;height:104px;background:rgba(255,90,120,.28);border:3px solid var(--red);font-size:.9rem}
#supBtn{right:max(140px,calc(env(safe-area-inset-right,0px) + 134px));bottom:calc(env(safe-area-inset-bottom,0px) + 30px);width:80px;height:80px;
  background:conic-gradient(var(--gold) calc(var(--p,0)*1%),rgba(255,255,255,.14) 0);font-size:.8rem}
#supBtn span{width:66px;height:66px;border-radius:50%;background:var(--panel);display:grid;place-items:center}
#supBtn.ready{animation:glowp .7s infinite alternate}#supBtn.ready span{background:var(--gold);color:#2a1a00}
@keyframes glowp{to{box-shadow:0 0 22px #ffc93c}}
.joy{position:fixed;width:120px;height:120px;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);z-index:3;pointer-events:none;transform:translate(-50%,-50%)}
.joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.55)}
.keys{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);font-size:.78rem;color:var(--dim);z-index:2;pointer-events:none;background:var(--panel);border-radius:999px;padding:5px 14px}
.banner{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);font-weight:700;font-size:clamp(1.8rem,8vw,3.4rem);color:var(--gold);-webkit-text-stroke:2px #3a1d6e;
  text-shadow:0 5px 0 #3a1d6e;white-space:nowrap;pointer-events:none;opacity:0;z-index:2;text-align:center}
.banner small{display:block;font-size:.4em;color:var(--ink);-webkit-text-stroke:0;text-shadow:0 2px 0 #000;margin-top:6px;font-weight:600}
.banner.show{animation:ban 1.8s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}18%{opacity:1;transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}
.layer{position:fixed;inset:0;z-index:5;display:grid;place-items:center;overflow:auto;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px))}
.layer.dim{background:rgba(10,7,18,.72)}
#menu{align-items:end}
.title{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;text-align:center;pointer-events:none;z-index:4}
.title h1{margin:0;font-size:clamp(2.2rem,10vw,3.4rem);font-weight:700;color:var(--gold);-webkit-text-stroke:2px #3a1d6e;text-shadow:0 5px 0 #3a1d6e;line-height:1}
.title p{margin:4px 0 0;color:var(--dim);font-weight:600}
.card{width:100%;max-width:520px;background:var(--panel);border:2px solid var(--line);border-radius:26px;padding:16px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.card h2{margin:0;font-size:2rem;font-weight:700;color:var(--gold);-webkit-text-stroke:1.5px #3a1d6e;text-shadow:0 4px 0 #3a1d6e;line-height:1}
.card p{margin:0;color:var(--dim);line-height:1.4}
.picker{display:flex;align-items:center;gap:10px;width:100%}
.arrow{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--glass);color:var(--ink);font-size:1.2rem;cursor:pointer;flex:none}
.who{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.who b{font-size:1.8rem;line-height:1}
.who .tr{color:var(--gold);font-weight:700;font-size:.9rem}
.who span{color:var(--dim);font-size:.84rem;line-height:1.3}
.who em{font-style:normal;color:var(--ink);font-weight:600}
.tabs{display:flex;gap:6px;background:rgba(0,0,0,.3);padding:4px;border-radius:999px;width:100%;box-sizing:border-box}
.tabs button{flex:1;font-family:var(--round);font-weight:600;font-size:.92rem;padding:8px;border-radius:999px;border:0;background:transparent;color:var(--dim);cursor:pointer;min-height:40px}
.tabs button.on{background:var(--gold);color:#3a1d6e}
.mdesc{font-size:.82rem;color:var(--dim)}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.go{font-family:var(--round);font-weight:700;font-size:1.25rem;background:var(--gold);color:#3a1d6e;border:0;border-radius:999px;padding:12px 34px;cursor:pointer;box-shadow:0 5px 0 #b07a12;min-height:48px}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 #b07a12}
.go.alt{background:var(--glass);color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.35);border:1px solid var(--line);font-size:1rem;padding:10px 20px}
.go:focus-visible,.arrow:focus-visible,.tabs button:focus-visible,.pauseb:focus-visible,.ctrl:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;cursor:pointer;font-weight:600;position:relative;width:100%}
.row input{position:absolute;opacity:0;width:1px;height:1px}
.sw{width:46px;height:26px;border-radius:999px;background:rgba(255,255,255,.18);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.row input:checked+.sw{background:var(--gold)}.row input:checked+.sw::after{transform:translateX(20px)}
.row input:focus-visible+.sw{outline:3px solid var(--sky);outline-offset:2px}
.big{font-size:3rem;font-weight:700;line-height:1}
.troph{font-size:1.3rem;font-weight:700;color:var(--gold)}
@media (pointer:fine){#atkBtn,#supBtn{display:none}}
@media (pointer:coarse){.keys{display:none}}
@media (max-height:520px){
  .card{padding:10px 14px;gap:6px;max-width:640px}.title h1{font-size:2rem}.title p{display:none}
  .who b{font-size:1.4rem}.who span{font-size:.76rem}.mdesc{display:none}
  #atkBtn{width:88px;height:88px}#supBtn{width:70px;height:70px;right:max(120px,calc(env(safe-area-inset-right,0px) + 116px))}#supBtn span{width:56px;height:56px}
}
@media (prefers-reduced-motion:reduce){.banner.show{animation:none;opacity:1}}
</style>

<canvas id="game"></canvas>
<div class="top" id="hudTop" hidden>
  <div class="score" id="lootHud"><span class="gemi"></span><span class="tm blue" id="blueG">0</span><div class="mid"><small id="midLabel">Time</small><b id="midVal">2:30</b></div><span class="tm red" id="redG">0</span><span class="gemi"></span></div>
  <div class="score" id="sdHud" hidden><div class="mid"><small>Brawlers left</small><b id="alive">6</b></div><div class="mid"><small>Gas</small><b id="gasT">0:25</b></div></div>
</div>
<button class="pauseb" id="pauseBtn" type="button" aria-label="Pause" hidden>II</button>
<button class="ctrl" id="supBtn" type="button" hidden aria-label="Super"><span>Super</span></button>
<button class="ctrl" id="atkBtn" type="button" hidden aria-label="Attack">Attack</button>
<div class="joy" id="joy" hidden><i id="knob"></i></div>
<div class="keys" id="keys" hidden>WASD to move · aim with the mouse · click to attack · Space for Super</div>
<div class="banner" id="banner"></div>

<div class="title" id="title"><h1>Ravenport Brawl</h1><p>Eight heroes. One arena. Bring the loot home.</p></div>
<div class="layer" id="menu">
  <div class="card">
    <div class="picker">
      <button class="arrow" id="prevH" type="button" aria-label="Previous hero">◀</button>
      <div class="who"><b id="hName">Leonidas</b><span class="tr" id="hTroph">0 trophies</span><span><em>Attack:</em> <span id="hAtk"></span></span><span><em>Super:</em> <span id="hSup"></span></span></div>
      <button class="arrow" id="nextH" type="button" aria-label="Next hero">▶</button>
    </div>
    <div class="tabs" role="group" aria-label="Mode"><button type="button" data-m="loot" class="on">Loot Grab · 3v3</button><button type="button" data-m="sd">Showdown · solo</button></div>
    <div class="mdesc" id="mDesc"></div>
    <div class="acts"><button class="go" id="playBtn" type="button">Brawl!</button><button class="go alt" id="setBtn" type="button">Settings</button></div>
  </div>
</div>
<div class="layer dim" id="pause" hidden>
  <div class="card">
    <h2 id="pTitle">Paused</h2>
    <label class="row"><span>Music</span><input type="checkbox" id="optMusic" checked><i class="sw"></i></label>
    <label class="row"><span>Sound effects</span><input type="checkbox" id="optSfx" checked><i class="sw"></i></label>
    <label class="row"><span>Glow effects</span><input type="checkbox" id="optGlow" checked><i class="sw"></i></label>
    <div class="acts"><button class="go" id="resumeBtn" type="button">Resume</button><button class="go alt" id="quitBtn" type="button">Leave match</button></div>
  </div>
</div>
<div class="layer dim" id="result" hidden>
  <div class="card">
    <h2 id="rTitle">Victory!</h2>
    <div class="big" id="rBig"></div>
    <p id="rText"></p>
    <div class="troph" id="rTroph"></div>
    <div class="acts"><button class="go" id="againBtn" type="button">Play again</button><button class="go alt" id="menuBtn" type="button">Change hero</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
if(!window.THREE){$('hAtk').textContent='The 3D engine could not load. Check your connection and reload.';return}
const T=THREE;
const renderer=new T.WebGLRenderer({canvas:$('game'),antialias:true});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
/* ---------- glow (bloom) + automatic quality ---------- */
function makeGlow(renderer,opts){opts=opts||{};
  const gl2=renderer.capabilities.isWebGL2,RT=(gl2&&T.WebGLMultisampleRenderTarget)?T.WebGLMultisampleRenderTarget:T.WebGLRenderTarget;
  const base=new RT(2,2,{depthBuffer:true});if(base.samples!==undefined)base.samples=4;
  const a=new T.WebGLRenderTarget(2,2,{depthBuffer:false}),b=new T.WebGLRenderTarget(2,2,{depthBuffer:false});
  const qs=new T.Scene(),qc=new T.OrthographicCamera(-1,1,1,-1,0,1),quad=new T.Mesh(new T.PlaneGeometry(2,2));quad.frustumCulled=false;qs.add(quad);
  const V='varying vec2 v;void main(){v=uv;gl_Position=vec4(position.xy,0.,1.);}';
  const bright=new T.ShaderMaterial({uniforms:{t:{value:null},th:{value:opts.threshold||.8}},vertexShader:V,depthTest:false,depthWrite:false,
    fragmentShader:'uniform sampler2D t;uniform float th;varying vec2 v;void main(){vec3 c=texture2D(t,v).rgb;float l=max(c.r,max(c.g,c.b));gl_FragColor=vec4(c*smoothstep(th,th+.18,l),1.);}'});
  const blur=new T.ShaderMaterial({uniforms:{t:{value:null},d:{value:new T.Vector2()}},vertexShader:V,depthTest:false,depthWrite:false,
    fragmentShader:'uniform sampler2D t;uniform vec2 d;varying vec2 v;void main(){vec3 s=texture2D(t,v).rgb*.227;s+=(texture2D(t,v+d*1.38).rgb+texture2D(t,v-d*1.38).rgb)*.316;s+=(texture2D(t,v+d*3.23).rgb+texture2D(t,v-d*3.23).rgb)*.07;gl_FragColor=vec4(s,1.);}'});
  const comp=new T.ShaderMaterial({uniforms:{t:{value:null},g:{value:null},k:{value:opts.strength||1.1}},vertexShader:V,depthTest:false,depthWrite:false,
    fragmentShader:'uniform sampler2D t;uniform sampler2D g;uniform float k;varying vec2 v;void main(){vec3 c=texture2D(t,v).rgb+texture2D(g,v).rgb*k;gl_FragColor=vec4(c,1.);}'});
  let w=2,h=2;
  function pass(mat,target){quad.material=mat;renderer.setRenderTarget(target);renderer.render(qs,qc)}
  return{
    on:true,
    setSize(W,H){const pr=renderer.getPixelRatio();w=Math.max(2,W*pr|0);h=Math.max(2,H*pr|0);base.setSize(w,h);a.setSize(w/4|0,h/4|0);b.setSize(w/4|0,h/4|0)},
    render(scene,camera){
      if(!this.on){renderer.setRenderTarget(null);renderer.render(scene,camera);return}
      renderer.setRenderTarget(base);renderer.render(scene,camera);
      bright.uniforms.t.value=base.texture;pass(bright,a);
      for(let i=0;i<2;i++){blur.uniforms.t.value=a.texture;blur.uniforms.d.value.set((i+1)/(w/4),0);pass(blur,b);
        blur.uniforms.t.value=b.texture;blur.uniforms.d.value.set(0,(i+1)/(h/4));pass(blur,a)}
      comp.uniforms.t.value=base.texture;comp.uniforms.g.value=a.texture;pass(comp,null)}
  }}
/* watches frame time while playing; turns glow off, then lowers resolution, on slow devices */
function makeAutoQuality(renderer,glow,onChange){let acc=0,n=0,level=0,cool=3;
  return{tick(real,playing){if(!playing||level>=2)return;cool-=real;if(cool>0)return;acc+=real;n++;
    if(acc>=2){const avg=acc/n;acc=0;n=0;
      if(avg>1/38){level++;cool=2;if(level===1&&glow.on){glow.on=false}else{level=2;renderer.setPixelRatio(1)}onChange&&onChange(level)}}}}}
const bloom=makeGlow(renderer,{threshold:.985,strength:1.1});
let glowPref=true;try{const gs=JSON.parse(localStorage.getItem('brawl-settings'));if(gs&&gs.glow===false)glowPref=false}catch(e){}bloom.on=glowPref;

const scene=new T.Scene();const camera=new T.PerspectiveCamera(45,1,.1,200);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);bloom.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

/* toon helpers */
const gm=new T.DataTexture(new Uint8Array([110,110,110,255,185,185,185,255,255,255,255,255]),3,1,T.RGBAFormat);gm.minFilter=gm.magFilter=T.NearestFilter;gm.needsUpdate=true;
const toon=(c,o={})=>new T.MeshToonMaterial(Object.assign({color:c,gradientMap:gm},o));
const OUT=new T.MeshBasicMaterial({color:0x1d1038,side:T.BackSide});
const SPH=new T.SphereGeometry(1,22,16),CYL=new T.CylinderGeometry(1,1,1,16),CONE=new T.ConeGeometry(1,1,16),BOX=new T.BoxGeometry(1,1,1),TOR=new T.TorusGeometry(1,.3,8,20),GEM=new T.OctahedronGeometry(1);
function part(geo,mat,x,y,z,sx=1,sy=1,sz=1,outline=true){const m=new T.Mesh(geo,mat);m.position.set(x,y,z);m.scale.set(sx,sy,sz);
  if(outline){const o=new T.Mesh(geo,OUT);o.scale.setScalar(1.08);m.add(o)}return m}

/* ---------- cape ---------- */
function makeCape(c1,L,Wd){const geo=new T.PlaneGeometry(1,1,8,8);const uv=geo.attributes.uv,pos=geo.attributes.position,n=pos.count;
  const mesh=new T.Mesh(geo,toon(c1,{side:T.DoubleSide}));mesh.frustumCulled=false;
  const edge=new T.Mesh(geo,new T.MeshBasicMaterial({color:0x1d1038,side:T.BackSide}));edge.scale.setScalar(1.0);
  let flap=0,op=0;
  function update(t,speed,vy,dt=0.016,open=0){flap+= (speed-flap)*Math.min(1,dt*6);op+=(open-op)*Math.min(1,dt*7);
    const droop=Math.max(-.15,0.62-flap*0.55+Math.max(0,-vy)*-0.035+Math.max(0,vy)*0.02)*(1-op*0.85);
    for(let i=0;i<n;i++){const u=1-uv.getY(i),v=uv.getX(i)*2-1;
      const wave=Math.sin(t*(8+flap*8)-u*5+v*.6)*u*(0.05+flap*0.12);
      const along=u*L*(1-op*0.2);let x=-along,y=-along*0.12-droop*u*u+wave*(1+op)+op*u*(0.3-v*v*0.22);const z=v*Wd*0.5*(1+u*0.3)*(1+op*1.25);
      y-=v*v*0.36*(1-u*0.25)*(1-op*0.9);x+=v*v*0.04;pos.setXYZ(i,x,y,z)}
    pos.needsUpdate=true;geo.computeVertexNormals()}
  update(0,0,0);return{mesh,update}}

/* ---------- dogs ---------- */
function legSet(body,mat,paw,spots,hip,len){const legs=[];for(const[lx,lz] of spots){const L=new T.Group();L.position.set(lx,hip,lz);
  L.add(part(CYL,mat,0,-len/2,0,0.1,len,0.1));L.add(part(SPH,paw,0.03,-len,0,0.12,0.08,0.12));body.add(L);legs.push(L)}return legs}
function makeCorgi(){const g=new T.Group(),body=new T.Group();g.add(body);
  const O=toon(0xe8913f),Od=toon(0xc8702a),Wh=toon(0xfff3e2),Bk=toon(0x1a1420),Pk=toon(0xf4a3ae),Tg=toon(0xff6f8a),Gd=toon(0xffc93c),Br=toon(0x6b3a1c),MK=toon(0x111016),SH=new T.MeshBasicMaterial({color:0xffffff});
  // torso: deep chest, long back, round rear
  body.add(part(SPH,O,0.12,0.62,0,0.5,0.38,0.4));
  body.add(part(SPH,O,-0.38,0.64,0,0.4,0.36,0.38));
  body.add(part(SPH,Wh,0.06,0.42,0,0.48,0.2,0.3,false));                     // belly
  for(const[x,y,z,r] of[[0.4,0.66,0,.26],[0.46,0.52,0.1,.17],[0.46,0.52,-0.1,.17],[0.52,0.78,0,.18],[0.36,0.46,0,.18]])body.add(part(SPH,Wh,x,y,z,r,r,r*.9,false)); // fluffy chest
  for(const s of[-1,1])body.add(part(SPH,Wh,-0.58,0.58,s*0.16,0.17,0.2,0.14,false)); // white "corgi butt" patches
  // tail: fluffy stub with a white tip
  const tail=new T.Group();tail.position.set(-0.74,0.78,0);body.add(tail);
  tail.add(part(SPH,O,-0.06,0.03,0,0.14,0.12,0.12));tail.add(part(SPH,Wh,-0.16,0.06,0,0.08,0.07,0.07,false));
  // short sturdy legs with toes
  const legs=[];for(const[lx,lz,back] of[[0.36,0.2,0],[0.36,-0.2,0],[-0.42,0.21,1],[-0.42,-0.21,1]]){const L=new T.Group();L.position.set(lx,0.36,lz);
    L.add(part(SPH,back?O:Wh,0,-0.02,0,0.15,0.16,0.14));
    L.add(part(CYL,back?O:Wh,0,-0.17,0,0.11,0.22,0.11));
    L.add(part(SPH,Wh,0.04,-0.3,0,0.13,0.08,0.13));
    for(const tz of[-0.06,0,0.06])L.add(part(SPH,Wh,0.15,-0.31,tz,0.035,0.035,0.035,false));
    body.add(L);legs.push(L)}
  // head
