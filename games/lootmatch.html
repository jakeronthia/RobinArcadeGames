<script>
/* Loot Match: swap two pieces of loot to line up three or more. 60 seconds on the clock.

(function () {
  var M = Mini, sky = M.sky({ seed: 31 }), C = 6, Rw = 7, TYPES = 5, NEED = 22;

    function add(t) { var id = t.r * 10 + t.c; if (!mark[id]) { mark[id] = 1; set.push(t); } }

  function startClear(set, isPower) { phase = 'clear'; timer = .2; cascade++; var n = set.length, pts = n * 10 * cascade + (n >= 5 ? 50 : n === 4 ? 20 : 0); M.add(pts); if (!isPower) charge = Math.min(NEED, charge + n);

    else for (var b = 0; b < 2; b++) { r = 1 + Math.random() * (Rw - 2) | 0; c = 1 + Math.random() * (C - 2) | 0; for (i = -1; i <= 1; i++) for (j = -1; j <= 1; j++) add(at(r + i, c + j)); }

  function move(x, y) { if (!drag || phase !== 'idle') return; var dx = x - drag.x, dy = y - drag.y, th = B.cs * .32; if (Math.abs(dx) < th && Math.abs(dy) < th) return; var t = drag.t, o = Math.abs(dx) > Math.abs(dy) ? at(t.r, t.c + (dx > 0 ? 1 : -1)) : at(t.r + (dy > 0 ? 1 : -1), t.c); drag = null; if (o) trySwap(t, o); }
  function step(dt) { var r, c, t;
    for (r = 0; r < Rw; r++) for (c = 0; c < C; c++) { t = grid[r][c]; if (!t) continue; var k = Math.min(1, dt * (phase === 'fall' ? 13 : 20)); t.vr += (t.r - t.vr) * k; t.vc += (t.c - t.vc) * k; if (t.rm) t.rm = Math.min(1, t.rm + dt * 5.5); t.pop *= Math.pow(.01, dt); }
    powFx *= Math.pow(.05, dt);
    if (phase === 'swap' && settled()) { var m = matches(); if (m.length) { userSwap = null; startClear(m); } else { swapCells(userSwap[0], userSwap[1]); phase = 'back'; M.snd('wrong'); } }
    else if (phase === 'back' && settled()) { phase = 'idle'; userSwap = null; }
    else if (phase === 'clear') { timer -= dt; if (timer <= 0) collapse(); }
    else if (phase === 'fall' && settled()) { var m2 = matches(); if (m2.length) startClear(m2); else { phase = 'idle'; if (cascade >= 3) M.pop(M.W / 2, B.y - 6 * M.u, cascade >= 5 ? 'JACKPOT COMBO!' : 'COMBO!', '#ffc93c', 26); if (!findMove()) shuffle(); } }
    if (M.state !== 'play') return;

    if (time <= 0 && phase === 'idle') { M.over('Loot sorted before the thieves came back.', "TIME'S UP"); return; }
    if (phase === 'idle') { idleT += dt; if (idleT > 4 && !hint) hint = findMove(); } }
  function piece(ctx, type, x, y, s) { var u = s / 2; ctx.save(); ctx.translate(x, y); ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(2, s * .075); ctx.strokeStyle = M.INK; var f = COL[type], d = DARK[type], i;
    ctx.beginPath();
    if (type === 0) { ctx.arc(0, 0, u * .78, 0, 6.283); ctx.fillStyle = f; ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 0, u * .52, 0, 6.283); ctx.fillStyle = '#ffe08a'; ctx.fill(); ctx.fillStyle = d; ctx.font = '700 ' + (u * .8) + 'px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('$', 0, u * .05); }
    else if (type === 1) { ctx.moveTo(-u * .8, -u * .2); ctx.lineTo(-u * .42, -u * .68); ctx.lineTo(u * .42, -u * .68); ctx.lineTo(u * .8, -u * .2); ctx.lineTo(0, u * .8); ctx.closePath(); ctx.fillStyle = f; ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-u * .8, -u * .2); ctx.lineTo(u * .8, -u * .2); ctx.moveTo(-u * .25, -u * .2); ctx.lineTo(0, u * .8); ctx.lineTo(u * .25, -u * .2); ctx.lineWidth *= .5; ctx.strokeStyle = d; ctx.stroke(); }
    else if (type === 2) { M.rr(ctx, -u * .66, -u * .74, u * 1.32, u * 1.48, u * .3); ctx.fillStyle = f; ctx.fill(); ctx.stroke(); M.rr(ctx, -u * .36, -u * .44, u * .72, u * .88, u * .14); ctx.fillStyle = '#9af0b6'; ctx.fill(); }
    else if (type === 3) { for (i = 0; i < 6; i++) { var a = i / 6 * 6.283 + .5236; ctx.lineTo(Math.cos(a) * u * .8, Math.sin(a) * u * .8); } ctx.closePath(); ctx.fillStyle = f; ctx.fill(); ctx.stroke(); ctx.beginPath(); for (i = 0; i < 6; i++) { var a2 = i / 6 * 6.283 + .5236; ctx.lineTo(Math.cos(a2) * u * .42, Math.sin(a2) * u * .42); } ctx.closePath(); ctx.fillStyle = '#c4ecff'; ctx.fill(); }
    else { for (i = 0; i < 10; i++) { var a3 = i / 10 * 6.283 - 1.5708, rr = (i % 2 ? .4 : .86) * u; ctx.lineTo(Math.cos(a3) * rr, Math.sin(a3) * rr); } ctx.closePath(); ctx.fillStyle = f; ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.arc(0, u * .04, u * .2, 0, 6.283); ctx.fillStyle = '#e2d0ff'; ctx.fill(); }

    ctx.save(); ctx.beginPath(); ctx.rect(B.x - 8 * u, B.y - 2 * u, B.w + 16 * u, B.h + 12 * u); ctx.clip();

      if (t.rm) { s *= 1 + t.rm * .35; ctx.globalAlpha = 1 - t.rm; } s *= 1 + t.pop * .2;
