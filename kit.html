<script src="data.js"></script>
<script src="site.js"></script>
<script>
(function () {
  var list = [{ name: '$ROBIN', file: 'robin' }].concat(HEROES.map(function (h) { return { name: h.name, file: h.img.split('/').pop().replace('.png', '') }; }));
  var box = document.getElementById('kit');
  list.forEach(function (s) {
    var d = document.createElement('div'); d.className = 'sticker';
    var src = 'assets/stickers/' + s.file + '.png';
    d.innerHTML = '<img loading="lazy" alt=""><b></b><a class="btn" download>Download</a>';
    d.querySelector('img').src = src; d.querySelector('img').alt = s.name + ' sticker';
    d.querySelector('b').textContent = s.name;
    var a = d.querySelector('a'); a.href = src; a.setAttribute('download', 'robin-' + s.file + '.png');
    box.appendChild(d);
  });
})();
</script>
