name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tools and NEAR testnet
        run: |
          mkdir -p ci
          { echo "date: $(date -u)"; cargo --version; rustup --version; node -v;
            curl -s -m 10 -X POST https://rpc.testnet.near.org -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"status","params":[]}' | head -c 300; } > ci/probe.txt 2>&1
      - name: Commit result
        run: |
          git config user.name "ci-bot"; git config user.email "ci-bot@users.noreply.github.com"
          git add ci/probe.txt && git commit -m "ci: probe result [skip ci]" && git push
