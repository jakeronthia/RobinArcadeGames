name: vault
on:
  push:
    paths: ['vault-contract/**', 'assets/fx/vaultsim.js', '.github/workflows/vault.yml']
permissions:
  contents: write
concurrency: vault
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Rules engine cross-check (JS vs Rust)
        working-directory: vault-contract/sim
        run: |
          cargo build -q --release --example replay
          node ../tools/simcheck.js ../target/release/examples/replay | tee ../ci/simcheck.txt
      - name: Install cargo-near and near-cli
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/near-cli-rs/releases/latest/download/near-cli-rs-installer.sh | sh
          rustup target add wasm32-unknown-unknown
      - name: Build contracts
        working-directory: vault-contract
        run: |
          mkdir -p ci
          { (cd demo-token && cargo near build non-reproducible-wasm --no-abi) ; echo "exit $?"; (cd vault && cargo near build non-reproducible-wasm --no-abi); echo "exit $?"; find . -name '*.wasm' -path '*near*' | xargs ls -la; } > ci/build.txt 2>&1 || true
          tail -60 ci/build.txt
      - name: Create a testnet account with the faucet
        run: |
          mkdir -p ci
          for try in 1 2 3 4; do
            MAIN="robinarcade-$(date +%s)-$RANDOM.testnet"
            if near account create-account sponsor-by-faucet-service "$MAIN" autogenerate-new-keypair save-to-legacy-keychain network-config testnet create >> ci/faucet.txt 2>&1; then echo "MAIN=$MAIN" >> $GITHUB_ENV; echo "ok $MAIN" >> ci/faucet.txt; break; fi
            echo "faucet try $try failed" >> ci/faucet.txt; sleep 45
          done
          tail -20 ci/faucet.txt
          sleep 5
      - name: Deploy, test end to end, lock
        working-directory: vault-contract/ci
        run: |
          npm install --silent
          node deploy.mjs
      - name: Browser check of the site against testnet
        if: always()
        working-directory: vault-contract/ci
        run: |
          mkdir -p ../../ci
          npx playwright install --with-deps chromium > /dev/null 2>&1 || true
          timeout 180 node uitest.mjs || true
      - name: Report back
        if: always()
        run: |
          mkdir -p ci
          cp vault-contract/ci/simcheck.txt vault-contract/ci/build.txt ci/ 2>/dev/null || true
          git config user.name "ci-bot"; git config user.email "ci-bot@users.noreply.github.com"
          git add -f assets/vault-deploy.json ci/ 2>/dev/null || true
          git commit -m "ci: vault deploy report [skip ci]" || true
          git pull --rebase -q origin main && git push || true
