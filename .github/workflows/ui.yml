name: ui
on:
  push:
    paths: ['treasury.html', 'treasury.js', 'game.html', 'assets/fx/robinvault.js', 'worker/**', 'tests/ui/**', '.github/workflows/ui.yml']
permissions:
  contents: write
concurrency: ui
jobs:
  guest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Guest flow against testnet
        working-directory: tests/ui
        run: |
          npm install --silent
          npx playwright install --with-deps chromium > /dev/null 2>&1
          timeout 300 node guest.mjs || true
      - name: Report back
        if: always()
        run: |
          git config user.name "ci-bot"; git config user.email "ci-bot@users.noreply.github.com"
          git add -f ci/guest.txt ci/ui_guest.png ci/ui_treasury.png 2>/dev/null || true
          git commit -m "ci: guest flow report [skip ci]" || true
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push && break; sleep 10; done
